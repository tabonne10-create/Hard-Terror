<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDÈ - Gestion des Commandes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Style Custom Néon -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100">

    <!-- En-tête / Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-primary">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                    <img src="../images/frt.png" alt="BIDÈ Logo" height="40" class="rounded">
                    <span class="fw-bold">BIDÈ | GESTION</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="commandes.html">Commandes</a></li>
                        <li class="nav-item"><a class="nav-link" href="laveurs.html">Laveurs</a></li>
                        <li class="nav-item"><a class="nav-link" href="rapports.html">Rapports</a></li>
                        <li class="nav-item"><a class="nav-link" href="utilisateurs.html">Utilisateurs</a></li>
                        <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenu Principal -->
    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-gradient mb-0">Registre des Commandes</h2>
            <a href="dashboard.html" class="btn btn-primary btn-sm">+ Nouvelle Saisie</a>
        </div>

        <!-- Barre de Recherche et Filtres -->
        <div class="card card-bide-neon p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="search-plaque" class="form-control bg-dark text-white border-secondary" placeholder="Rechercher par immatriculation ou N° Ticket..." oninput="filtrerCommandes()">
                </div>
                <div class="col-md-6">
                    <select id="filter-statut" class="form-select bg-dark text-white border-secondary" onchange="filtrerCommandes()">
                        <option value="TOUS">Tous les statuts</option>
                        <option value="En attente">En attente</option>
                        <option value="En cours">En cours</option>
                        <option value="Lavé">Lavé</option>
                        <option value="Payé">Payé</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tableau des Commandes -->
        <div class="card card-bide-neon">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-primary text-info">
                            <th>Ticket N°</th>
                            <th>Plaque</th>
                            <th>Engin</th>
                            <th>Formule</th>
                            <th>Heure</th>
                            <th>Statut</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-commandes-body">
                        <!-- Généré dynamiquement par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="text-center py-3 border-top border-secondary mt-auto">
        <small class="text-muted">&copy; 2026 BIDÈ - Académie Digitale Numérique</small>
    </footer>

    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', afficherRegistreCommandes);
    </script>
</body>
</html>
